name: "Research Question"
description: "Research Question submission. A contribution is not automatic acceptance; it goes to review."
labels: ["research", "raw"]
body:
  - type: markdown
    attributes:
      value: "You do not need linguistic training. Say what you know and how you know it. 'Not sure' is useful."
  - type: textarea
    id: question
    attributes:
      label: "Your question"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why does it matter?"
    validations:
      required: false
  - type: checkboxes
    id: cc0
    attributes:
      label: "Public domain dedication"
      description: "Published contributions are dedicated to the public domain under CC0 1.0. This cannot be undone once published."
      options:
        - label: "I wrote or recorded this, or have the right to share it, and I dedicate it under CC0 1.0 if it is published."
          required: true
