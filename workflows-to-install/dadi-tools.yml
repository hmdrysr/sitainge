# Dadi tools: one workflow for everything the project needs done from the Actions tab.
# Install once (see docs/dadi/SETUP.md). After that, run it from Actions > "Dadi tools" > Run workflow.
#   unpack-zip   unzip any .zip at the repository root, check the data, rebuild the app's offline copy, publish the site
#   check-data   validate the repository and run the tests
#   rebuild-seed rebuild the app's offline copy of the words, then publish the site
#   deploy-site  publish website/ to GitHub Pages
#   ingest-issue turn one Dadi contribution issue into RAW records and open a pull request
# Contribution issues titled "[Dadi] ..." are ingested automatically when they are opened.
# Nothing is ever accepted automatically: records enter as RAW, unverified. A steward reviews the pull request.
# Optional: repository variable DADI_AUTOMERGE = true merges those pull requests on their own (RAW only).
# Optional: repository secret WORKFLOW_PAT (fine-grained token, Contents and Workflows: write) lets unpack-zip also
# install changed workflow files. Without it, GitHub refuses any automated change to .github/workflows.
name: Dadi tools
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        required: true
        options: [unpack-zip, check-data, rebuild-seed, deploy-site, ingest-issue]
      issue:
        description: Issue number (ingest-issue only)
        required: false
  issues:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
jobs:
  unpack:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'unpack-zip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT || github.token }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml jsonschema
      - name: Unzip
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No .zip file at the repository root. Upload one first."; exit 1; fi
          for z in "${zips[@]}"; do echo "Unpacking $z"; unzip -o "$z"; rm "$z"; done
      - name: Check data
        run: python3 scripts/validate.py
      - name: Rebuild the app's offline copy
        run: node scripts/build_dadi_seed.js
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Unpack update zip (Dadi tools)"
          git push
          gh workflow run "Deploy site"
  check:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'check-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml jsonschema
      - run: python3 scripts/validate.py
      - run: node scripts/tests/website_core_test.js
      - run: node scripts/tests/dadi_unit_test.js
      - run: node scripts/tests/dadi_relay_test.js
  seed:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'rebuild-seed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build_dadi_seed.js
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Offline copy already up to date."; exit 0; }
          git commit -m "Rebuild Dadi offline copy"
          git push
          gh workflow run "Deploy site"
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'deploy-site'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy site" --repo "$GITHUB_REPOSITORY"
  ingest:
    if: (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Dadi]')) || (github.event_name == 'workflow_dispatch' && inputs.task == 'ingest-issue')
    runs-on: ubuntu-latest
    concurrency:
      group: dadi-ingest
      cancel-in-progress: false
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml jsonschema
      - name: Read the issue
        run: gh issue view "$ISSUE" --json number,title,body,author > issue.json
      - name: Convert to RAW records
        run: |
          python3 scripts/dadi_ingest_issue.py issue.json
          rm -f issue.json
          python3 scripts/validate.py
      - name: Open a pull request
        run: |
          git config user.name "dadi-ingest"; git config user.email "actions@users.noreply.github.com"
          br="dadi-issue-$ISSUE"
          git checkout -b "$br"
          git add -A
          git commit -m "Ingest Dadi contribution from issue #$ISSUE as RAW"
          git push origin "$br"
          url=$(gh pr create --base "${{ github.event.repository.default_branch }}" --title "Ingest Dadi contribution #$ISSUE (RAW, unverified)" --body "Created from issue #$ISSUE by the Dadi tools workflow. RAW records only: nothing is accepted. Merging this closes the issue." )
          echo "pr=$url" >> "$GITHUB_ENV"
          if [ "${{ vars.DADI_AUTOMERGE }}" = "true" ]; then gh pr merge "$url" --squash --delete-branch; fi
          gh issue comment "$ISSUE" --body "Thank you. Your contribution was converted to RAW records and opened for review: $url"
      - name: Say so if it failed
        if: failure()
        run: gh issue comment "$ISSUE" --body "The automatic step could not read this contribution (see the Dadi tools run in the Actions tab). Nothing was lost; a steward will handle it by hand." || true
