# Dadi tools: one workflow for everything the project needs done from the Actions tab.
# Install once (see docs/dadi/SETUP.md). After that, run it from Actions > "Dadi tools" > Run workflow.
#   unpack-zip   unzip any .zip at the repository root, check the data, rebuild the app's offline copy, publish the site
#   check-data   validate the repository and run the tests
#   rebuild-seed rebuild the app's offline copy of the words, then publish the site
#   deploy-site  publish website/ to GitHub Pages
#   ingest-issue turn one Dadi contribution issue into RAW records and open a pull request
#   check-videos check every listed video still plays, count open reports, hide flagged or missing ones (runs weekly too)
#   update-media find new freely licensed photos on Wikimedia Commons and credit them (runs weekly too)
#   ingest-votes add open "[Vote]" issues (label: vote) to votes/votes.jsonl, comment on and close each one, then run consensus
#   consensus    recompute website/data/consensus.json and reports/consensus-report.md (runs after unpack-zip and ingest-votes too)
# Contribution issues titled "[Dadi] ..." are ingested automatically when they are opened.
# Nothing is ever accepted automatically: records enter as RAW, unverified. A steward reviews the pull request.
# Votes and consensus labels are signals only. They never change an evidence level or a state (docs/protocols/voting-and-consensus.md).
# Optional: repository variable DADI_AUTOMERGE = true merges those pull requests on their own (RAW only).
# Optional: repository secret WORKFLOW_PAT (fine-grained token, Contents and Workflows: write) lets unpack-zip also
# install changed workflow files. Without it, GitHub refuses any automated change to .github/workflows.
name: Dadi tools
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        required: true
        options: [unpack-zip, check-data, rebuild-seed, deploy-site, ingest-issue, check-videos, update-media, rebuild-icons, ingest-votes, consensus]
      issue:
        description: Issue number (ingest-issue only)
        required: false
  issues:
    types: [opened]
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
jobs:
  unpack:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'unpack-zip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT || github.token }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml jsonschema
      - name: Unzip
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No .zip file at the repository root. Upload one first."; exit 1; fi
          for z in "${zips[@]}"; do echo "Unpacking $z"; unzip -o "$z"; rm "$z"; done
      - name: Check data
        run: python3 scripts/validate.py
      - name: Rebuild the app's offline copy
        run: node scripts/build_dadi_seed.js
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Unpack update zip (Dadi tools)"
          git push
          gh workflow run "Deploy site"
  votes:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'ingest-votes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    concurrency:
      group: dadi-votes
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: List open vote issues
        run: |
          # Issues labelled "vote", plus open issues titled "[Vote] ...": GitHub drops labels set by people without triage access.
          # Pull requests are left out. Titles and bodies are only ever read as data by scripts/ingest_votes.py.
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" | jq -s 'add // [] | map(select((.pull_request | not) and ((.title | startswith("[Vote]")) or any(.labels[]?; .name == "vote"))))' > issues.json
          echo "Open vote issues: $(jq length issues.json)"
      - name: Add the votes
        run: |
          python3 scripts/ingest_votes.py issues.json --result ingest-result.json
          python3 scripts/validate.py
      - name: Commit the votes
        run: |
          git config user.name "dadi-votes"; git config user.email "actions@users.noreply.github.com"
          git add votes/votes.jsonl
          git diff --cached --quiet && { echo "No new votes."; exit 0; }
          git commit -m "Add votes from GitHub issues (Dadi tools)"
          git pull --rebase
          git push
      - name: Comment on and close the issues
        run: |
          # The comment text comes from scripts/ingest_votes.py, never from the issue itself.
          jq -c '.[] | select(.number != null)' ingest-result.json | while read -r row; do
            n=$(echo "$row" | jq -r '.number'); msg=$(echo "$row" | jq -r '.message'); out=$(echo "$row" | jq -r '.outcome')
            case "$n" in ''|*[!0-9]*) continue;; esac
            gh issue comment "$n" --body "$msg" || true
            if [ "$out" = "added" ] || [ "$out" = "already" ]; then gh issue close "$n" --reason completed || true; else gh issue close "$n" --reason "not planned" || true; fi
          done
  consensus:
    needs: [unpack, votes]
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.task == 'consensus') || needs.unpack.result == 'success' || needs.votes.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: dadi-consensus
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Recompute consensus
        run: |
          if python3 scripts/consensus.py --check; then echo "Consensus already up to date."; exit 0; fi
          python3 scripts/consensus.py
      - name: Commit and publish
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add website/data/consensus.json reports/consensus-report.md
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Recompute consensus labels (Dadi tools)"
          git pull --rebase
          git push
          gh workflow run "Deploy site"
  check:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'check-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml jsonschema
      - run: python3 scripts/validate.py
      - run: node scripts/tests/website_core_test.js
      - run: node scripts/tests/dadi_unit_test.js
      - run: node scripts/tests/dadi_relay_test.js
      - run: node scripts/tests/dadi_translate_test.js
      - run: node scripts/tests/dadi_learn_test.js
      - run: python3 scripts/tests/test_new_records.py
      - run: python3 scripts/tests/test_consensus.py
      - run: python3 scripts/consensus.py --check
      - run: python3 scripts/update_media.py --selftest
  seed:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'rebuild-seed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build_dadi_seed.js
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Offline copy already up to date."; exit 0; }
          git commit -m "Rebuild Dadi offline copy"
          git push
          gh workflow run "Deploy site"
  icons:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'rebuild-icons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save @tabler/icons @iconify-json/tabler
      - run: node scripts/build_icons.js
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add website/dadi/data/icons.json
          git diff --cached --quiet && { echo "Icons already up to date."; exit 0; }
          git commit -m "Rebuild Dadi icon index"
          git push
          gh workflow run "Deploy site"
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'deploy-site'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy site" --repo "$GITHUB_REPOSITORY"
  media:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.task == 'check-videos' || inputs.task == 'update-media'))
    runs-on: ubuntu-latest
    concurrency:
      group: dadi-media
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check videos
        if: github.event_name == 'schedule' || inputs.task == 'check-videos'
        run: |
          gh issue list --search '"[Video report]" in:title' --state open --limit 200 --json title,number > reports.json || echo '[]' > reports.json
          python3 scripts/check_videos.py --reports reports.json
          rm -f reports.json
      - name: Update photos
        if: github.event_name == 'schedule' || inputs.task == 'update-media'
        run: python3 scripts/update_media.py || echo "Photo update skipped (Commons not reachable). Nothing changed."
      - name: Commit and publish
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add website/data
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Dadi tools: refresh videos and photos"
          git push
          gh workflow run "Deploy site"
  ingest:
    if: (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Dadi]')) || (github.event_name == 'workflow_dispatch' && inputs.task == 'ingest-issue')
    runs-on: ubuntu-latest
    concurrency:
      group: dadi-ingest
      cancel-in-progress: false
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml jsonschema
      - name: Read the issue
        run: gh issue view "$ISSUE" --json number,title,body,author > issue.json
      - name: Convert to RAW records
        run: |
          python3 scripts/dadi_ingest_issue.py issue.json
          rm -f issue.json
          python3 scripts/validate.py
      - name: Open a pull request
        run: |
          git config user.name "dadi-ingest"; git config user.email "actions@users.noreply.github.com"
          br="dadi-issue-$ISSUE"
          git checkout -b "$br"
          git add -A
          git commit -m "Ingest Dadi contribution from issue #$ISSUE as RAW"
          git push origin "$br"
          url=$(gh pr create --base "${{ github.event.repository.default_branch }}" --title "Ingest Dadi contribution #$ISSUE (RAW, unverified)" --body "Created from issue #$ISSUE by the Dadi tools workflow. RAW records only: nothing is accepted. Merging this closes the issue." )
          echo "pr=$url" >> "$GITHUB_ENV"
          if [ "${{ vars.DADI_AUTOMERGE }}" = "true" ]; then gh pr merge "$url" --squash --delete-branch; fi
          gh issue comment "$ISSUE" --body "Thank you. Your contribution was converted to RAW records and opened for review: $url"
      - name: Say so if it failed
        if: failure()
        run: gh issue comment "$ISSUE" --body "The automatic step could not read this contribution (see the Dadi tools run in the Actions tab). Nothing was lost; a steward will handle it by hand." || true
